<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Gates</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 600px;
            height: 450px;
            background: linear-gradient(135deg, #2c3e50, #111);
            border: 4px solid #d4af37;
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        header {
            position: absolute;
            top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 2px;
        }
        .door {
            width: 160px;
            height: 260px;
            background: #8B4513;
            border: 6px solid #5c2c16;
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.7), 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .door:hover {
            transform: scale(1.02);
        }
        .handle {
            width: 16px;
            height: 16px;
            background: #ffd700;
            border-radius: 50%;
            position: absolute;
            right: 20px;
            top: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .message {
            position: absolute;
            bottom: 20px;
            font-size: 16px;
            color: #f1c40f;
            text-align: center;
            padding: 0 20px;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }
        button {
            background-color: #d4af37;
            color: #111;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #f39c12;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header id="level-title">ДВЕРЬ 1</header>
        
        <div class="door" id="main-door" onclick="tryOpenDoor()">
            <div class="handle"></div>
        </div>

        <div class="message" id="game-message">Нажмите на дверь, чтобы открыть её!</div>
    </div>

    <div class="controls">
        <button onclick="resetGame()">Начать заново</button>
    </div>

    <script>
        let currentLevel = 1;
        const maxLevel = 4;

        function tryOpenDoor() {
            const message = document.getElementById('game-message');
            const title = document.getElementById('level-title');

            if (currentLevel === 1) {
                message.innerText = "Дверь 1 открыта! Переходим дальше...";
                setTimeout(nextLevel, 1200);
            } else if (currentLevel === 2) {
                let code = prompt("Введите код для Двери 2 (подсказка: 7429):");
                if (code === "7429") {
                    message.innerText = "Верный код! Дверь 2 открыта!";
                    setTimeout(nextLevel, 1200);
                } else {
                    message.innerText = "Неверный код! Попробуйте еще раз.";
                }
            } else if (currentLevel === 3) {
                message.innerText = "Вы нашли тайник и открыли Дверь 3!";
                setTimeout(nextLevel, 1200);
            } else if (currentLevel === 4) {
                message.innerText = "Поздравляем! Вы прошли все тестовые двери!";
                title.innerText = "ПОБЕДА!";
            }
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel <= maxLevel) {
                document.getElementById('level-title').innerText = "ДВЕРЬ " + currentLevel;
                document.getElementById('game-message').innerText = "Уровень " + currentLevel + ". Кликните на дверь!";
            }
        }

        function resetGame() {
            currentLevel = 1;
            document.getElementById('level-title').innerText = "ДВЕРЬ 1";
            document.getElementById('game-message').innerText = "Нажмите на дверь, чтобы открыть её!";
        }
    </script>

</body>
</html>
