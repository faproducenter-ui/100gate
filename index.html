<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайна 100 Дверей</title>
    <style>
        :root { --gold: #f5c542; }
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; user-select: none; }
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* Панель переключения языка */
        .lang-switch { position: absolute; top: 15px; left: 15px; display: flex; gap: 6px; }
        .lang-btn { background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .lang-btn:hover { background: var(--gold); color: #000; }

        /* Верхняя панель и статистика */
        .top-bar { position: absolute; top: 15px; right: 15px; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .brand { color: var(--gold); font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .buy-btn { background: var(--gold); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .buy-btn:hover { transform: scale(1.05); }

        /* Подсказки и управление */
        .hint-box { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 12px 24px; border-radius: 12px; border: 1px solid var(--gold); text-align: center; }
        .controls-info { position: absolute; bottom: 15px; left: 15px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <!-- Игровой интерфейс -->
    <div id="game-ui">
        <!-- Кнопки языка -->
        <div class="lang-switch interactive">
            <button class="lang-btn" onclick="changeLanguage('ru')">RU</button>
            <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
        </div>

        <!-- Верхняя панель (Название, Монеты, Кнопка Покупки) -->
        <div class="top-bar">
            <div>
                <div class="brand" id="txt-title">ТАЙНА 100 ДВЕРЕЙ</div>
                <div style="font-size:11px; color:#888;" id="txt-sub">МИР 1. ЗАБРОШЕННЫЙ ОСОБНЯК</div>
            </div>
            <div style="text-align: right;">
                <span id="txt-coins-label">МОНЕТЫ:</span> <strong id="coins-count" style="color:var(--gold);">100</strong>
            </div>
            <button class="buy-btn interactive" onclick="payWithRobokassa(100, 'Покупка 100 монет')" id="txt-buy-btn">+ КУПИТЬ</button>
        </div>

        <!-- Подсказка посередине -->
        <div class="hint-box">
            <span id="txt-hint">Осмотрись. Найди ключ и подсказку с кодом.</span>
        </div>

        <!-- Информация об управлении -->
        <div class="controls-info" id="txt-controls">
            WASD — движение | Мышь — осмотр | E — взаимодействие
        </div>
    </div>

    <!-- Скрипты: Перевод и Логика Оплаты -->
    <script>
        // --- 1. ПЕРЕВОД И ЯЗЫКИ (RU / EN) ---
        const translations = {
            ru: {
                title: "ТАЙНА 100 ДВЕРЕЙ",
                sub: "МИР 1. ЗАБРОШЕННЫЙ ОСОБНЯК",
                coins: "МОНЕТЫ:",
                buy: "+ КУПИТЬ",
                hint: "Осмотрись. Найди ключ и подсказку с кодом.",
                controls: "WASD — движение | Мышь — осмотр | E — взаимодействие"
            },
            en: {
                title: "SECRET OF 100 DOORS",
                sub: "WORLD 1. ABANDONED MANSION",
                coins: "COINS:",
                buy: "+ BUY COINS",
                hint: "Look around. Find the key and code hint.",
                controls: "WASD — move | Mouse — look | E — interact"
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-sub').innerText = t.sub;
            document.getElementById('txt-coins-label').innerText = t.coins;
            document.getElementById('txt-buy-btn').innerText = t.buy;
            document.getElementById('txt-hint').innerText = t.hint;
            document.getElementById('txt-controls').innerText = t.controls;
        }

        // --- 2. ОПЛАТА ЧЕРЕЗ ROBOKASSA И ВАШ БЭКЕНД ---
        async function payWithRobokassa(amount, description) {
            try {
                const response = await fetch('https://100gate-backend-lc0cdijc4-faproducenter-2690.vercel.app/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: amount,
                        description: description
                    })
                });

                const data = await response.json();

                if (data.paymentUrl) {
                    // Перенаправляем игрока на Robokassa
                    window.location.href = data.paymentUrl;
                } else {
                    alert('Ошибка создания платежа.');
                }
            } catch (error) {
                console.error('Ошибка соединения:', error);
                alert('Не удалось связаться с сервером оплаты.');
            }
        }
    </script>

</body>
</html>
