<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Последний шанс — 3D-прототип</title>
<style>
:root{--gold:#e9b85b;--panel:rgba(7,13,20,.88);--line:rgba(233,184,91,.35)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#eef3f6;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}canvas{display:block;width:100%;height:100%;outline:none}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 8px 30px #0006}.brand{position:absolute;left:16px;top:14px;padding:11px 14px;max-width:min(420px,calc(100vw - 32px))}.brand strong{display:block;font-size:16px;letter-spacing:.12em;color:var(--gold)}.brand small{color:#aebcc6}.stats{position:absolute;right:16px;top:14px;padding:10px 13px;text-align:right;font-size:13px;line-height:1.65}.stats b{color:var(--gold)}#objective{position:absolute;left:16px;top:105px;padding:10px 13px;font-size:13px;max-width:270px}#hint{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:10px 15px;max-width:calc(100vw - 30px);text-align:center;font-size:14px;display:none}#crosshair{position:absolute;left:50%;top:50%;width:7px;height:7px;border:1px solid #fff9;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 8px #000;display:none}.controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 20px)}button{color:#f5f6f7;background:#17232d;border:1px solid #52606a;border-radius:9px;padding:10px 13px;font-size:13px;font-weight:650;cursor:pointer;touch-action:manipulation}button:hover{border-color:var(--gold)}button.primary{background:#9c6b22;border-color:#e9b85b;color:white}#touchpad{position:absolute;left:14px;bottom:20px;display:none;pointer-events:auto;gap:5px;align-items:center;flex-direction:column}#touchpad div{display:flex;gap:5px}#touchpad button{width:48px;height:45px;padding:0;background:#101c26d9;font-size:18px}#lookpad{position:absolute;right:14px;bottom:24px;display:none;pointer-events:auto;gap:7px;flex-direction:column}#lookpad button{width:50px;height:44px;padding:0;background:#101c26d9}#modal{position:fixed;inset:0;background:#02070bc9;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}#modal .box{width:min(420px,100%);padding:22px;text-align:center}#modal h2{margin:0 0 8px;color:var(--gold)}#modal p{color:#c3cdd3;line-height:1.5}#code{width:100%;padding:13px;margin:8px 0 14px;background:#0c141b;color:#fff;border:1px solid #60717c;border-radius:8px;font-size:24px;text-align:center;letter-spacing:.35em}#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#0c171feF;border:1px solid var(--line);padding:12px 17px;border-radius:10px;display:none;z-index:4;text-align:center;max-width:90vw}#mobiletip{position:absolute;right:16px;bottom:80px;color:#c4d0d7;font-size:11px;text-align:right;max-width:210px}@media(max-width:650px){.brand{left:8px;top:8px;padding:8px 10px}.brand strong{font-size:13px}.brand small{font-size:10px}.stats{right:8px;top:8px;font-size:11px;padding:7px 9px}#objective{left:8px;top:80px;font-size:11px;max-width:190px}.controls{bottom:8px;gap:5px}.controls button{padding:9px;font-size:11px}#hint{bottom:132px;font-size:12px}#touchpad,#lookpad{display:flex}#mobiletip{display:none}}
</style>
</head>
<body>
<div id="hud">
 <div class="brand panel"><strong>ПОСЛЕДНИЙ ШАНС</strong><small>3D • интерактивный прототип</small></div>
 <div class="stats panel">Комната: <b id="roomNum">01</b><br>Очки: <b id="score">0</b> &nbsp; Монеты: <b id="coins">0</b><br>Камера: <b id="camLabel">3-е лицо</b></div>
 <div id="objective" class="panel">ЗАДАНИЕ<br><b>Исследуйте лабораторию.</b><br>Найдите ключ и подсказку к коду.</div>
 <div id="crosshair"></div><div id="hint" class="panel"></div>
 <div class="controls"><button id="camBtn">Камера: 3-е лицо [V]</button><button id="interactBtn" class="primary">Осмотреть рядом [E]</button><button id="helpBtn">Управление</button><button id="resetBtn">С начала</button></div>
 <div id="touchpad"><button data-move="forward">▲</button><div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div></div>
 <div id="lookpad"><button data-look="up">↑</button><div><button data-look="left">←</button><button data-look="right">→</button></div><button data-look="down">↓</button></div>
 <div id="mobiletip">На компьютере: WASD / стрелки, мышь, E, V</div>
</div>
<div id="modal"><div class="box panel"><h2 id="modalTitle">Электронный замок</h2><p id="modalText">Введите четырёхзначный код, найденный в лаборатории.</p><input id="code" inputmode="numeric" maxlength="4" placeholder="••••"><div style="display:flex;gap:8px"><button id="cancelModal" style="flex:1">Назад</button><button id="submitCode" class="primary" style="flex:1">Открыть</button></div></div></div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111b24);scene.fog=new THREE.FogExp2(0x111b24,.026);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa9c7dc,0x25201b,1.25));const keyLight=new THREE.DirectionalLight(0xffdfb0,2.4);keyLight.position.set(-4,8,3);keyLight.castShadow=true;keyLight.shadow.mapSize.set(1024,1024);scene.add(keyLight);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const concrete=mat(0x50565a),floorMat=mat(0x303a40),dark=mat(0x111a20,.55),metal=mat(0x65737b,.35,.72),rust=mat(0x6c4935),yellow=mat(0xd7a443,.4),glass= new THREE.MeshStandardMaterial({color:0x8ab6c7,metalness:.4,roughness:.2,transparent:true,opacity:.35}),paper=mat(0xd8cda9),glowMat=new THREE.MeshStandardMaterial({color:0x5ce0ff,emissive:0x1a91b9,emissiveIntensity:2});
const box=(w,h,d,material,x,y,z,cast=true)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o};
let room=1,score=0,coins=0,hasKey=false,hasNote=false,doorOpen=false,foundClock=false,cameraMode=3,toastTimer=null;const objects=[];let door,doorPanel,character,head,body,legL,legR,armL,armR;
const state={pos:new THREE.Vector3(0,0,3.6),yaw:0,pitch:-.06,move:{forward:false,back:false,left:false,right:false},look:{up:false,down:false,left:false,right:false},lastInteract:0};
function clearRoom(){for(const o of [...objects]){scene.remove(o);if(o.geometry)o.geometry.dispose()}objects.length=0;}
function addObj(mesh,type,name,desc,action){mesh.userData={type,name,desc,action};objects.push(mesh);return mesh;}
function buildRoom(){clearRoom();scene.fog.density=.026;scene.background.set(room===1?0x111b24:room===2?0x1b1b24:0x10212a);
 // room architecture, 12x7x16; rear entrance at z=-7.7
 box(12,.35,16,floorMat,0,-.22,0,false);box(12,.35,16,concrete,0,4,0,false);box(.35,4,16,concrete,-6,1.8,0,false);box(.35,4,16,concrete,6,1.8,0,false);box(12,4,.35,concrete,0,1.8,7.8,false);
 // back wall split around door
 box(4.1,4,.35,concrete,-3.95,1.8,-7.8,false);box(4.1,4,.35,concrete,3.95,1.8,-7.8,false);box(3.8,.7,.35,concrete,0,3.65,-7.8,false);
 // ceiling lights
 for(let z of [-5,-1,3,6]){box(2.2,.08,.55,mat(0x7f969d,.3),0,3.77,z,false);let l=new THREE.PointLight(z===-5?0xffd29b:0x9ad7e9,z===-5?1.4:.75,8);l.position.set(0,3.4,z);scene.add(l);objects.push(l)}
 // pipes and warning stripes
 for(let z of [-4,0,4]){let p=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,11.5,10),metal);p.rotation.z=Math.PI/2;p.position.set(0,3.35,z);scene.add(p);objects.push(p)}
 // lockers and lab benches
 for(let i=0;i<3;i++){let x=-4.8+i*.95;box(.72,2.25,.75,metal,x,1,-5.8);box(.55,.035,.03,yellow,x,1.25,-5.39,false);box(.08,.08,.06,dark,x+.22,1,-5.38,false)}
 box(2.5,.15,1.2,rust,-3.7,.85,-1.7);box(2.35,.9,1.05,metal,-3.7,.3,-1.7);for(let x of [-4.55,-2.85])box(.12,.65,.12,metal,x,.3,-1.7);
 box(1.7,.14,.9,metal,3.7,.85,2.8);box(1.6,.8,.8,dark,3.7,.35,2.8);
 // door frame and sliding door
 box(2.25,3.25,.22,dark,0,1.58,-7.55);door=box(1.8,2.8,.16,room===1?mat(0x4c5960,.42,.5):mat(0x394c58,.35,.65),0,1.4,-7.38);door.userData.isDoor=true;
 box(1.15,.34,.1,dark,0,2.65,-7.25);doorPanel=box(.55,.24,.06,doorOpen?glowMat:yellow,0,2.65,-7.17,false);
 // wall labels and screens
 const screen=box(1.45,.9,.08,mat(0x07171c,.3,.2),-2.1,2.3,-7.57,false);const screenGlow=box(1.22,.62,.025,glowMat,-2.1,2.3,-7.51,false);
 for(let i=0;i<6;i++)box(.22,.22,.08,i%2?yellow:rust,2.4+(i%3)*.36,1.9+Math.floor(i/3)*.36,-7.55,false);
 // clutter crates
 box(.8,.65,.8,rust,4.9,.32,-2.7);box(.65,.45,.65,mat(0x3e474d),4.35,.22,-3.2);
 // room-specific interactables
 if(room===1){
  const keymesh=new THREE.Mesh(new THREE.TorusGeometry(.18,.045,8,18),yellow);keymesh.position.set(-3.7,1.12,-1.7);keymesh.rotation.x=Math.PI/2;addObj(keymesh,'key','Старый ключ','Ключ от аварийного шкафчика. Он может пригодиться у двери.',()=>{if(!hasKey){hasKey=true;score+=50;coins+=10;scene.remove(keymesh);objects.splice(objects.indexOf(keymesh),1);notify('Найден старый ключ: +50 очков, +10 монет.')}else notify('Ключ уже у вас.');updateUI()});
  const note=box(.38,.025,.28,paper,3.7,.95,2.8,false);note.rotation.y=.15;addObj(note,'note','Записка на столе','На бумаге написано: «Код замка — 1842. Не доверяй часам: они отстают».',()=>{hasNote=true;score+=25;coins+=5;notify('Записка изучена. Код: 1842. +25 очков, +5 монет.');updateUI();note.userData.action=()=>notify('Вы уже прочитали записку: код 1842.')});
  const clock=box(.48,.48,.08,mat(0x1d2428,.3,.2),4.1,2.15,-7.52,false);const face=new THREE.Mesh(new THREE.CircleGeometry(.19,24),mat(0xe0d7be,.7));face.position.set(4.1,2.15,-7.46);scene.add(face);objects.push(face);const hand=box(.025,.15,.025,rust,4.1,2.18,-7.42,false);hand.rotation.z=.6;addObj(clock,'clock','Сломанные часы','Стрелки застыли на 18:42 — возможно, это часть подсказки.',()=>{foundClock=true;score+=10;notify('Часы остановились на 18:42. В записке указан код 1842.');updateUI();clock.userData.action=()=>notify('Часы по-прежнему показывают 18:42.')});
 } else {
  const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.42),glowMat);crystal.position.set(-3.6,1.1,-1.5);addObj(crystal,'artifact','Энергетическое ядро','Редкий образец из лаборатории. Его можно забрать.',()=>{if(!crystal.userData.taken){crystal.userData.taken=true;scene.remove(crystal);score+=100;coins+=25;notify('Энергетическое ядро получено! +100 очков, +25 монет.');updateUI()}else notify('Вы уже забрали ядро.')});
  const log=box(.42,.04,.28,paper,3.65,.96,2.8,false);addObj(log,'log','Журнал исследователя','В журнале: «Каждая следующая дверь опаснее предыдущей. Смотри под ноги».',()=>{score+=15;notify('Вы прочитали журнал исследователя. +15 очков.');updateUI();log.userData.action=()=>notify('Журнал уже изучен.')});
 }
 // exit sign
 box(1.2,.28,.07,mat(0x183c30),0,3.15,-7.54,false);box(.7,.04,.025,mat(0x65e6a0,.3),0,3.15,-7.49,false);
 // update door after room rebuild
 if(doorOpen){door.position.y=4.5;doorPanel.material=glowMat}else{door.position.y=1.4;doorPanel.material=yellow}
}
function buildCharacter(){character=new THREE.Group();body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.8,5,8),mat(0x344653,.65,.1));body.position.y=1.1;body.castShadow=true;character.add(body);head=new THREE.Mesh(new THREE.SphereGeometry(.25,16,12),mat(0xb5a18b));head.position.y=1.82;head.castShadow=true;character.add(head);const pack=new THREE.Mesh(new THREE.BoxGeometry(.42,.55,.2),mat(0x202b30));pack.position.set(0,1.18,.28);character.add(pack);armL=new THREE.Mesh(new THREE.CapsuleGeometry(.095,.52,4,6),mat(0x465967));armL.position.set(-.43,1.16,0);character.add(armL);armR=armL.clone();armR.position.x=.43;character.add(armR);legL=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.55,4,6),mat(0x252e35));legL.position.set(-.18,.42,0);character.add(legL);legR=legL.clone();legR.position.x=.18;character.add(legR);scene.add(character);}
function rebuild(){buildRoom();if(!character)buildCharacter();character.position.set(state.pos.x,0,state.pos.z);updateUI()}
function notify(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3100)}
function updateUI(){$('roomNum').textContent=String(room).padStart(2,'0');$('score').textContent=score;$('coins').textContent=coins;$('camLabel').textContent=cameraMode===1?'1-е лицо':'3-е лицо';$('camBtn').textContent='Камера: '+(cameraMode===1?'1-е лицо':'3-е лицо')+' [V]';$('objective').innerHTML='ЗАДАНИЕ<br><b>'+(room===1?(hasKey&&hasNote?'Откройте дверь кодом 1842.':'Исследуйте лабораторию. Найдите ключ и записку.'):'Найдите энергетическое ядро и изучите журнал.')+'</b><br>'+(hasNote?'Подсказка: код 1842.':foundClock?'Часы показывают 18:42.':'Ищите интерактивные предметы рядом со столами.'))}
function nearest(){let best=null,dist=2.35;for(const o of objects){if(!o.userData?.type)continue;const p=o.getWorldPosition(new THREE.Vector3());const d=p.distanceTo(new THREE.Vector3(state.pos.x,1.2,state.pos.z));if(d<dist){dist=d;best=o}}return best}
function interact(){const o=nearest();if(!o){notify('Рядом нет предметов. Осмотритесь и подойдите ближе.');return}if(o.userData.type==='door'){if(doorOpen){notify('Дверь открыта. Проходите дальше.');return}if(!hasKey)notify('Замок заблокирован. Сначала найдите ключ в лаборатории.');else openKeypad();return}notify(o.userData.name+' — '+o.userData.desc);if(o.userData.action)o.userData.action()}
function openKeypad(){ $('modal').style.display='flex';$('code').value='';$('code').focus()}
function closeKeypad(){$('modal').style.display='none'}
function submitCode(){const val=$('code').value.trim();if(val==='1842'){closeKeypad();doorOpen=true;door.position.y=4.5;doorPanel.material=glowMat;score+=100;coins+=20;notify('Дверь открыта! +100 очков, +20 монет. Проходите в следующий сектор.');updateUI()}else{ $('modalText').textContent='Неверный код. Изучите записку и часы внимательнее.'; $('code').value='';notify('Код не подошёл.');}}
function nextRoom(){room++;doorOpen=false;hasKey=false;hasNote=false;foundClock=false;state.pos.set(0,0,3.6);state.yaw=0;rebuild();notify('Сектор '+String(room).padStart(2,'0')+': новая зона лаборатории.');}
// register exit doorway as interactable each build
const originalBuildRoom=buildRoom;
buildRoom=function(){originalBuildRoom();if(door){addObj(door,'door','Герметичная дверь','Электронный замок с четырёхзначным кодом.',()=>{if(doorOpen){nextRoom()}else if(!hasKey)notify('Нужен ключ для доступа к панели замка.');else openKeypad()})}}
// key input
const keyMap={KeyW:'forward',ArrowUp:'forward',KeyS:'back',ArrowDown:'back',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
addEventListener('keydown',e=>{if(keyMap[e.code]){state.move[keyMap[e.code]]=true;e.preventDefault()}if(e.code==='KeyE'||e.code==='Space')interact();if(e.code==='KeyV')toggleCamera();if(e.code==='Escape')closeKeypad()});addEventListener('keyup',e=>{if(keyMap[e.code])state.move[keyMap[e.code]]=false});
let pointerLocked=false;renderer.domElement.addEventListener('click',()=>{if(cameraMode===1&&innerWidth>700&&!pointerLocked)renderer.domElement.requestPointerLock?.()});document.addEventListener('pointerlockchange',()=>pointerLocked=document.pointerLockElement===renderer.domElement);document.addEventListener('mousemove',e=>{if(pointerLocked){state.yaw-=e.movementX*.0025;state.pitch=Math.max(-.75,Math.min(.55,state.pitch-e.movementY*.002))}});
let touchLookInterval=null;document.querySelectorAll('[data-move]').forEach(b=>{const m=b.dataset.move;const on=()=>state.move[m]=true,off=()=>state.move[m]=false;b.addEventListener('pointerdown',e=>{e.preventDefault();on()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});document.querySelectorAll('[data-look]').forEach(b=>{const dir=b.dataset.look;b.addEventListener('pointerdown',e=>{e.preventDefault();state.look[dir]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>state.look[dir]=false))});
function toggleCamera(){cameraMode=cameraMode===1?3:1;$('crosshair').style.display=cameraMode===1?'block':'none';updateUI();notify(cameraMode===1?'Вид от первого лица. На компьютере нажмите на сцену для управления мышью.':'Вид от третьего лица.')}
$('camBtn').onclick=toggleCamera;$('interactBtn').onclick=interact;$('helpBtn').onclick=()=>notify('WASD/стрелки — движение • мышь — осмотр в 1-м лице • E — взаимодействие • V — смена камеры. На телефоне используйте экранные кнопки.');$('resetBtn').onclick=()=>{room=1;score=0;coins=0;hasKey=false;hasNote=false;doorOpen=false;foundClock=false;state.pos.set(0,0,3.6);state.yaw=0;rebuild();notify('Игра начата заново.')};$('cancelModal').onclick=closeKeypad;$('submitCode').onclick=submitCode;$('code').addEventListener('keydown',e=>{if(e.key==='Enter')submitCode()});
// Mark key and objects with soft lights
function animate(t){requestAnimationFrame(animate);const dt=Math.min(.04,(t-(animate.last||t))/1000);animate.last=t;
 if(state.look.left)state.yaw+=dt*1.3;if(state.look.right)state.yaw-=dt*1.3;if(state.look.up)state.pitch=Math.min(.55,state.pitch+dt);if(state.look.down)state.pitch=Math.max(-.75,state.pitch-dt);
 let f=(state.move.forward?1:0)-(state.move.back?1:0),s=(state.move.right?1:0)-(state.move.left?1:0);const len=Math.hypot(f,s);if(len){f/=len;s/=len;const speed=3.3;state.pos.x+=(-Math.sin(state.yaw)*f+Math.cos(state.yaw)*s)*speed*dt;state.pos.z+=(-Math.cos(state.yaw)*f-Math.sin(state.yaw)*s)*speed*dt;state.pos.x=Math.max(-5.35,Math.min(5.35,state.pos.x));state.pos.z=Math.max(-7.0,Math.min(7.0,state.pos.z));if(state.pos.z<-6.7&&Math.abs(state.pos.x)<1.1){if(doorOpen){nextRoom()}else state.pos.z=-6.65}if(character){character.rotation.y=state.yaw+Math.PI;const swing=Math.sin(t*.012)*.42;legL.rotation.x=len?swing:0;legR.rotation.x=len?-swing:0;armL.rotation.x=len?-swing*.7:0;armR.rotation.x=len?swing*.7:0}}
 if(character)character.position.set(state.pos.x,0,state.pos.z);
 if(cameraMode===3){const target=new THREE.Vector3(state.pos.x,1.25,state.pos.z);const offset=new THREE.Vector3(Math.sin(state.yaw)*4.7,2.6,Math.cos(state.yaw)*4.7);camera.position.lerp(target.clone().add(offset),.16);camera.lookAt(target.x,1.0,target.z)}else{camera.position.set(state.pos.x,1.72,state.pos.z);camera.rotation.order='YXZ';camera.rotation.y=state.yaw;camera.rotation.x=state.pitch}
 const o=nearest();if(o){$('hint').style.display='block';$('hint').textContent='E — '+o.userData.name+' · '+o.userData.desc}else{$('hint').style.display='none'}
 renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
rebuild();toggleCamera();toggleCamera();camera.position.set(0,2,9);camera.lookAt(0,1,0);animate(0);
</script>
</body></html>
