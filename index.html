<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Gates — 100gate.online</title>
<style>
:root{--bg:#0f1117;--card:#181b25;--line:#2a2f3f;--tx:#e8e6df;--mut:#9a9aa8;--gold:#e0b44c;--ok:#4cc38a;--bad:#e5564f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#232842,var(--bg) 60%);color:var(--tx);font-family:system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;letter-spacing:.08em;color:var(--gold)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px}
button:hover{border-color:var(--gold)}
button.p{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.lang button.on{background:var(--gold);color:#1a1405}
.coins{color:var(--gold);font-weight:700}
main{max-width:860px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.g{padding:10px 0;text-align:center;border-radius:8px;border:1px solid var(--line);background:#12141c}
.g.done{border-color:var(--ok);color:var(--ok)}.g.cur{border-color:var(--gold);color:var(--gold);cursor:pointer}.g.done{cursor:pointer}
.g.lock{opacity:.35}
.q{font-size:26px;text-align:center;margin:18px 0;min-height:40px;word-break:break-word}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
input[type=text]{font:inherit;font-size:20px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#0c0e14;color:var(--tx);width:220px;text-align:center}
.tbar{height:8px;background:#0c0e14;border-radius:4px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--gold);width:100%}
.sym{font-size:30px;padding:10px 14px}
.msg{text-align:center;min-height:24px;margin:8px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;background:#12141c}
.item .e{font-size:34px}.item small{color:var(--mut);display:block;min-height:34px;margin:4px 0 8px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.modal.open{display:flex}.modal .card{max-width:760px;width:100%;margin-top:30px}
h2{margin:0 0 12px;font-size:18px}.mut{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>⛩ 100 GATES</h1>
  <div class="bar">
    <span class="coins">🪙 <span id="coins">0</span></span>
    <button onclick="openShop()" id="bShop"></button>
    <div class="lang"><button id="lEN" onclick="setLang('en')">EN</button> <button id="lRU" onclick="setLang('ru')">RU</button></div>
  </div>
</header>
<main>
  <section id="home">
    <div class="card"><h2 id="tTitle"></h2><p class="mut" id="tIntro"></p>
      <button class="p" id="bPlay" onclick="play(S.level)"></button>
      <button id="bReset" onclick="resetAll()"></button></div>
    <div class="card"><h2 id="tMap"></h2><div class="grid" id="map"></div></div>
    <div class="card"><h2 id="tInv"></h2><div id="inv" class="mut"></div></div>
  </section>
  <section id="game" style="display:none">
    <div class="card">
      <div class="bar" style="justify-content:space-between"><b id="gTitle"></b><span id="gLives"></span></div>
      <div class="tbar" style="margin:10px 0"><i id="tfill"></i></div>
      <div class="mut" id="gTask" style="text-align:center"></div>
      <div class="q" id="gQ"></div>
      <div id="gIn" class="row"></div>
      <div class="msg" id="gMsg"></div>
      <div class="row" id="gItems"></div>
      <div class="row"><button onclick="home()" id="bBack"></button></div>
    </div>
  </section>
</main>
<div class="modal" id="shop" onclick="if(event.target===this)closeShop()">
  <div class="card">
    <div class="bar" style="justify-content:space-between"><h2 id="sTitle"></h2><button onclick="closeShop()">✕</button></div>
    <h3 id="sCoins"></h3><div class="shop" id="packs"></div>
    <h3 id="sItems" style="margin-top:22px"></h3><div class="shop" id="items"></div>
    <div class="msg" id="sMsg"></div>
  </div>
</div>
<div class="modal" id="pay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="card" style="max-width:420px;text-align:center">
    <h2 id="pTitle"></h2><p id="pInfo" class="mut"></p>
    <div class="row"><button class="p" onclick="pay('card')" id="pCard"></button><button class="p" onclick="pay('crypto')" id="pCrypto"></button></div>
  </div>
</div>

<script>
/* ============ PAYMENT CONFIG ============
 DEMO:true  -> coins are credited instantly (for testing only!)
 DEMO:false -> opens your payment link. Real crediting must be done by your server
 after a webhook from the payment provider (Stripe / NOWPayments / Coinbase Commerce, etc.).
 Put your payment links below. */
const PAY = {
  DEMO: true,
  prices: {50:'$0.99', 100:'$1.99', 200:'$3.99', 500:'$8.99'},
  card:   {50:'', 100:'', 200:'', 500:''},   // e.g. Stripe Payment Links
  crypto: {50:'', 100:'', 200:'', 500:''}    // e.g. NOWPayments / Coinbase Commerce links
};
/* ============ TEXTS ============ */
const T = {
 en:{title:'Welcome, traveller',intro:'100 gates stand between you and the end of the road. Each gate hides a riddle — and each one is harder than the last. Solve them all.',play:'Continue',reset:'New game',map:'The 100 gates',inv:'Inventory',shop:'🛒 Shop',back:'← Back',
  coins:'Buy coins',items:'Inventory items',buy:'Buy',gate:'Gate',lives:'Lives',time:'sec',
  m:'Solve the equation',s:'Find the next number',c:'Decode the word (letters are shifted)',r:'Memorize the sequence, then repeat it',
  go:'Check',win:'Gate opened! +',lose:'Wrong!',out:'Time is up!',dead:'No lives left. Try again.',empty:'Empty',
  hint:'Hint',tm:'Time +15s',sh:'Shield',sk:'Skip key',hintD:'Reveals the first character of the answer',tmD:'Adds 15 seconds',shD:'Adds one extra life',skD:'Opens the current gate instantly',
  nocoins:'Not enough coins',bought:'Purchased!',payT:'Choose payment',card:'💳 Bank card',crypto:'₿ Crypto',payNo:'Payment link is not configured yet.',demo:'DEMO mode: coins credited for testing.',
  finish:'You opened all 100 gates! Legend.',sure:'Reset all progress?',watch:'Memorize…',now:'Your turn!',pk:'coins'},
 ru:{title:'Добро пожаловать, путник',intro:'100 врат отделяют вас от конца пути. За каждыми — загадка, и каждая сложнее предыдущей. Пройдите их все.',play:'Продолжить',reset:'Новая игра',map:'100 врат',inv:'Инвентарь',shop:'🛒 Магазин',back:'← Назад',
  coins:'Купить монеты',items:'Предметы инвентаря',buy:'Купить',gate:'Врата',lives:'Жизни',time:'сек',
  m:'Решите пример',s:'Найдите следующее число',c:'Расшифруйте слово (буквы сдвинуты)',r:'Запомните последовательность и повторите её',
  go:'Проверить',win:'Врата открыты! +',lose:'Неверно!',out:'Время вышло!',dead:'Жизни закончились. Попробуйте снова.',empty:'Пусто',
  hint:'Подсказка',tm:'Время +15с',sh:'Щит',sk:'Ключ-пропуск',hintD:'Показывает первый символ ответа',tmD:'Добавляет 15 секунд',shD:'Даёт ещё одну жизнь',skD:'Мгновенно открывает текущие врата',
  nocoins:'Не хватает монет',bought:'Куплено!',payT:'Способ оплаты',card:'💳 Банковская карта',crypto:'₿ Криптовалюта',payNo:'Ссылка на оплату ещё не настроена.',demo:'DEMO-режим: монеты начислены для теста.',
  finish:'Вы открыли все 100 врат! Легенда.',sure:'Сбросить весь прогресс?',watch:'Запоминайте…',now:'Ваш ход!',pk:'монет'}
};
const ITEMS={hint:{e:'💡',p:10,k:'hint'},tm:{e:'⏳',p:15,k:'tm'},sh:{e:'🛡',p:25,k:'sh'},sk:{e:'🗝',p:60,k:'sk'}};
const WORDS=['GATE','KEY','TORCH','SHADOW','DRAGON','CASTLE','TEMPLE','MYSTERY','GUARDIAN','LABYRINTH','TREASURE','KINGDOM','PHOENIX','ECLIPSE','SERPENT'];
const SYM=['🔥','🌊','🌿','⚡','🌙','⭐','💎','🗡'];
/* ============ STATE ============ */
let S;
try{S=JSON.parse(localStorage.getItem('g100'))}catch(e){}
S=S||{coins:20,level:1,inv:{hint:1,tm:0,sh:0,sk:0},lang:(navigator.language||'en').startsWith('ru')?'ru':'en'};
function save(){try{localStorage.setItem('g100',JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id), t=k=>T[S.lang][k];
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
let G=null, timer=null, pendingPack=0;
/* ============ UI ============ */
function setLang(l){S.lang=l;save();document.documentElement.lang=l;render()}
function render(){
 $('lEN').classList.toggle('on',S.lang==='en');$('lRU').classList.toggle('on',S.lang==='ru');
 $('coins').textContent=S.coins;$('bShop').textContent=t('shop');
 $('tTitle').textContent=t('title');$('tIntro').textContent=t('intro');$('bPlay').textContent=t('play')+' ('+t('gate')+' '+Math.min(S.level,100)+')';
 $('bReset').textContent=t('reset');$('tMap').textContent=t('map');$('tInv').textContent=t('inv');$('bBack').textContent=t('back');
 let m='';for(let i=1;i<=100;i++){const c=i<S.level?'done':i===S.level?'cur':'lock';m+=`<div class="g ${c}" ${i<=S.level?`onclick="play(${i})"`:''}>${i}</div>`}
 $('map').innerHTML=m;
 const inv=Object.keys(ITEMS).filter(k=>S.inv[k]>0).map(k=>`${ITEMS[k].e} ${t(k)} ×${S.inv[k]}`).join(' &nbsp; ');
 $('inv').innerHTML=inv||t('empty');
 renderShop();if(G)drawGame();
}
function home(){clearInterval(timer);G=null;$('game').style.display='none';$('home').style.display='';render()}
function resetAll(){if(confirm(t('sure'))){S.level=1;S.coins=20;S.inv={hint:1,tm:0,sh:0,sk:0};save();render()}}
/* ============ SHOP ============ */
function renderShop(){
 $('sTitle').textContent=t('shop');$('sCoins').textContent=t('coins');$('sItems').textContent=t('items');
 $('packs').innerHTML=[50,100,200,500].map(n=>`<div class="item"><div class="e">🪙</div><b>${n} ${t('pk')}</b><small>${PAY.prices[n]}</small><button class="p" onclick="askPay(${n})">${t('buy')}</button></div>`).join('');
 $('items').innerHTML=Object.keys(ITEMS).map(k=>`<div class="item"><div class="e">${ITEMS[k].e}</div><b>${t(k)}</b><small>${t(k+'D')}<br>(×${S.inv[k]})</small><button onclick="buyItem('${k}')">🪙 ${ITEMS[k].p}</button></div>`).join('');
}
function openShop(){$('sMsg').textContent='';renderShop();$('shop').classList.add('open')}
function closeShop(){$('shop').classList.remove('open')}
function buyItem(k){const m=$('sMsg');if(S.coins<ITEMS[k].p){m.className='msg bad';m.textContent=t('nocoins');return}
 S.coins-=ITEMS[k].p;S.inv[k]++;save();m.className='msg ok';m.textContent=t('bought');render();$('shop').classList.add('open')}
function askPay(n){pendingPack=n;$('pTitle').textContent=n+' '+t('pk')+' — '+PAY.prices[n];$('pInfo').textContent=t('payT');$('pCard').textContent=t('card');$('pCrypto').textContent=t('crypto');$('pay').classList.add('open')}
function pay(method){
 const n=pendingPack,m=$('sMsg');$('pay').classList.remove('open');
 if(PAY.DEMO){S.coins+=n;save();m.className='msg ok';m.textContent=t('demo');render();$('shop').classList.add('open');return}
 const url=PAY[method][n];
 if(!url){m.className='msg bad';m.textContent=t('payNo');return}
 window.open(url,'_blank','noopener');
}
/* ============ PUZZLES ============ */
function makePuzzle(L){
 const type=['m','s','c','r'][L%4], d=Math.min(1+Math.floor(L/12),6);
 const P={type,time:Math.max(18,70-Math.floor(L*0.5))};
 if(type==='m'){
  const mx=Math.pow(10,d)-1,a=R(2,mx),b=R(2,mx);
  if(L<10){P.q=`${a} + ${b}`;P.a=a+b}
  else if(L<30){const op=R(0,1)?'+':'−';P.q=`${a} ${op} ${b}`;P.a=op==='+'?a+b:a-b}
  else{const c=R(2,Math.min(12,3+Math.floor(L/10))),x=R(2,30);P.q=`${a} + ${x} × ${c}`;P.a=a+x*c}
 }
 if(type==='s'){
  const st=R(1,10+L),k=R(2,5+Math.floor(L/4));let s=[];
  if(L<20){for(let i=0;i<5;i++)s.push(st+k*i);P.a=st+k*5}
  else if(L<50){for(let i=1;i<=5;i++)s.push(i*i+st);P.a=36+st}
  else{const r=R(2,3);for(let i=0;i<5;i++)s.push(st*Math.pow(r,i));P.a=st*Math.pow(r,5)}
  P.q=s.join(', ')+', ?';
 }
 if(type==='c'){
  const pool=WORDS.filter(w=>w.length<=3+Math.floor(L/10)+2);const w=pool[R(0,pool.length-1)]||WORDS[0],k=R(1,3+Math.floor(L/20));
  P.a=w;P.q=w.split('').map(ch=>String.fromCharCode((ch.charCodeAt(0)-65+k)%26+65)).join('');P.k=k;
 }
 if(type==='r'){const n=Math.min(3+Math.floor(L/8),12);P.seq=Array.from({length:n},()=>R(0,SYM.length-1));P.time=30+n*3}
 P.a=String(P.a);return P;
}
/* ============ GAME ============ */
function play(L){
 if(L>100){alert(t('finish'));return}
 G={L,lives:3,msg:'',pos:0};newPuzzle();$('home').style.display='none';$('game').style.display='';
}
function newPuzzle(){
 clearInterval(timer);G.p=makePuzzle(G.L);G.pos=0;G.left=G.p.time;G.total=G.p.time;G.msg='';G.show=G.p.type==='r';
 if(G.show){G.showTime=Math.max(2000,G.p.seq.length*700);setTimeout(()=>{if(G){G.show=false;drawGame();startTimer()}},G.showTime)}else startTimer();
 drawGame();
}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(!G)return;G.left-=0.25;$('tfill').style.width=Math.max(0,G.left/G.total*100)+'%';if(G.left<=0){fail(t('out'))}},250)}
function drawGame(){
 $('gTitle').textContent=t('gate')+' '+G.L+' / 100';$('gLives').textContent=t('lives')+': '+'❤'.repeat(G.lives);
 const p=G.p;$('gTask').textContent=t(p.type);
 const inEl=$('gIn');
 if(p.type==='r'){
  if(G.show){$('gQ').textContent=p.seq.map(i=>SYM[i]).join(' ');inEl.innerHTML='<span class="mut">'+t('watch')+'</span>'}
  else{$('gQ').textContent=p.seq.slice(0,G.pos).map(i=>SYM[i]).join(' ')+' '+'▫'.repeat(p.seq.length-G.pos);
   inEl.innerHTML=SYM.map((s,i)=>`<button class="sym" onclick="tap(${i})">${s}</button>`).join('')}
 }else{
  $('gQ').textContent=p.q;
  if(!inEl.querySelector('input')){inEl.innerHTML=`<input type="text" id="ans" autocomplete="off" onkeydown="if(event.key==='Enter')check()"><button class="p" onclick="check()">${t('go')}</button>`;setTimeout(()=>{const a=$('ans');a&&a.focus()},50)}
  else inEl.querySelector('button').textContent=t('go');
 }
 $('gMsg').textContent=G.msg;$('gMsg').className='msg '+(G.ok?'ok':'bad');
 $('gItems').innerHTML=Object.keys(ITEMS).map(k=>`<button onclick="useItem('${k}')" ${S.inv[k]>0?'':'disabled'}>${ITEMS[k].e} ${t(k)} ×${S.inv[k]}</button>`).join('');
}
function tap(i){if(G.show)return;const p=G.p;if(p.seq[G.pos]===i){G.pos++;if(G.pos>=p.seq.length)win();else drawGame()}else{G.pos=0;fail(t('lose'))}}
function check(){const v=($('ans').value||'').trim().toUpperCase().replace('−','-');if(!v)return;if(v===G.p.a.toUpperCase())win();else{$('ans').value='';fail(t('lose'))}}
function fail(msg){
 G.lives--;G.ok=false;
 if(G.lives<=0){clearInterval(timer);G.msg=t('dead');G.lives=3;G.msg=msg+' '+t('dead');G.p=makePuzzle(G.L);setTimeout(newPuzzle,1200);drawGame();return}
 G.msg=msg;G.left=Math.max(G.left,5);if(G.p.type==='r'){newPuzzleKeepLives()}else{G.p=makePuzzle(G.L);G.left=G.total=G.p.time;$('gIn').innerHTML='';drawGame()}
}
function newPuzzleKeepLives(){const l=G.lives,m=G.msg;newPuzzle();G.lives=l;G.msg=m;drawGame()}
function win(){
 clearInterval(timer);const r=5+Math.floor(G.L/5);S.coins+=r;if(G.L>=S.level)S.level=G.L+1;save();
 G.ok=true;G.msg=t('win')+r+' 🪙';$('gMsg').textContent=G.msg;$('gMsg').className='msg ok';$('coins').textContent=S.coins;
 const next=G.L+1;
 setTimeout(()=>{if(next>100){alert(t('finish'));home()}else{G.L=next;G.lives=3;$('gIn').innerHTML='';newPuzzle()}},1100);
}
function useItem(k){
 if(!G||S.inv[k]<1||G.show)return;const p=G.p;
 if(k==='hint'){if(p.type==='r'){G.show=true;setTimeout(()=>{G.show=false;drawGame()},2000)}else{G.msg='💡 '+p.a[0]+'…';G.ok=true}}
 if(k==='tm'){G.left+=15;G.total=Math.max(G.total,G.left)}
 if(k==='sh'){G.lives++}
 if(k==='sk'){S.inv[k]--;save();win();return}
 S.inv[k]--;save();$('coins').textContent=S.coins;drawGame();
}
render();
</script>
</body>
</html>
