<title>Dark Rooms — 100 Levels</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body,html{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#fff}
#cc{position:absolute;inset:0}#ui{position:absolute;inset:0;pointer-events:none;z-index:10}.ia{pointer-events:auto}
#top{position:absolute;top:15px;right:15px;display:flex;gap:10px;z-index:20}
.ib{background:rgba(20,20,20,.85);border:2px solid #666;color:#fff;padding:8px 14px;font:bold 15px inherit;cursor:pointer;border-radius:4px}
.ib:hover{border-color:#f33;color:#f33}
#cross{position:absolute;top:50%;left:50%;width:6px;height:6px;background:#fffb;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #000}
#prompt{position:absolute;top:55%;left:50%;transform:translateX(-50%);background:#000c;padding:8px 16px;border:1px solid #888;border-radius:4px;display:none;font-size:14px}
#hud{position:absolute;bottom:20px;left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.hi{background:#0009;padding:6px 12px;border-left:3px solid #f33;border-radius:2px}
#toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);background:#000d;border:1px solid #f33;padding:10px 20px;border-radius:4px;display:none;z-index:35;text-align:center;max-width:80%}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .5s;z-index:36;pointer-events:none}
.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0f0f0ff2;border:2px solid #555;padding:22px;width:92%;max-width:500px;display:none;flex-direction:column;gap:14px;z-index:30;border-radius:8px}
.modal h2{text-align:center;color:#f33;border-bottom:1px solid #444;padding-bottom:10px;text-transform:uppercase;letter-spacing:2px;font-size:20px}
.mc{font-size:15px;line-height:1.5;color:#ddd;max-height:300px;overflow-y:auto;background:#080808;padding:15px;border:1px solid #222;white-space:pre-wrap;user-select:text}
.btn{background:#222;border:1px solid #666;color:#fff;padding:10px 20px;cursor:pointer;text-align:center;font:bold 15px inherit}
.btn:hover{background:#f33;border-color:#f33;color:#000}
#si{width:100%;background:#000;border:2px solid #444;color:#0f0;font-size:32px;text-align:center;padding:10px;letter-spacing:8px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kp button{background:#222;border:1px solid #444;color:#fff;font-size:20px;padding:14px;cursor:pointer}.kp button:hover{background:#444}
#menu{position:absolute;inset:0;background:#050505f2;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;z-index:40}
.mt{font-size:40px;color:#f11;letter-spacing:5px;text-shadow:0 0 10px #f00;text-align:center}.mb{width:260px;font-size:17px}
#click{position:absolute;inset:0;background:#000b;display:none;justify-content:center;align-items:center;z-index:25;font-size:22px;color:#f33;cursor:pointer;text-align:center;padding:20px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px}.sr select,.sr input{background:#222;border:1px solid #555;color:#fff;padding:5px 10px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

 $('h2').textContent=!hasPaper?tx('obj1'):!hasKey?tx('obj2'):tx('obj3');$('h3').textContent=tx('coins')+SV.coins}

function tex(kind,col,rx,ry){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle=col;x.fillRect(0,0,256,256);const dk='rgba(0,0,0,.28)',lt='rgba(255,255,255,.07)';
 if(kind==='planks'){for(let i=0;i<8;i++){x.fillStyle='rgba(0,0,0,'+(.04+Math.random()*.13)+')';x.fillRect(0,i*32,256,32);x.fillStyle=dk;x.fillRect(0,i*32,256,2);for(let k=0;k<14;k++){x.fillStyle='rgba(0,0,0,.13)';x.fillRect(Math.random()*256,i*32+Math.random()*30,20+Math.random()*60,1)}x.fillRect((i*83)%256,i*32,2,32)}}
 if(kind==='tiles'){for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=(i+j)%2?lt:'rgba(0,0,0,.1)';x.fillRect(i*64,j*64,64,64);x.strokeStyle=dk;x.strokeRect(i*64,j*64,64,64)}}
 if(kind==='stone'){for(let j=0;j<6;j++){const o=j%2*32;for(let i=-1;i<5;i++){x.fillStyle='rgba(0,0,0,'+Math.random()*.16+')';x.fillRect(i*64+o,j*43,64,43);x.strokeStyle=dk;x.strokeRect(i*64+o,j*43,64,43)}}}
 if(kind==='wall'){for(let i=0;i<256;i+=32){x.fillStyle=lt;x.fillRect(i,0,16,256)}x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,224,256,32)}
 for(let i=0;i<900;i++){x.fillStyle='rgba(0,0,0,'+Math.random()*.09+')';x.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*3)}
 for(let i=0;i<4;i++){x.fillStyle='rgba(0,0,0,.07)';x.beginPath();x.arc(Math.random()*256,Math.random()*256,10+Math.random()*35,0,6.28);x.fill()}

const M=(t,r)=>new THREE.MeshStandardMaterial({map:t,roughness:r||.9});
/* ===== room ===== */
let room=new THREE.Group(),inter=[],cols=[],hx=4,hz=4,doorPivot=null,opening=0,pLight=null;scene.add(room);

function buildRoom(){
 clearRoom();const L=SV.level,li=Math.floor((L-1)/10),k=(L-1)%10,r=rng(L*131+7),P=PAL[li];
 hx=3+r()*1.5+k*.12;hz=3.2+r()*1.5+k*.12;const H=3.4;

 fw(lw,-hx+lw/2);fw(rw,hx-rw/2);const lin=add(new THREE.Mesh(new THREE.PlaneGeometry(dw,H-dh),wmX),dx,dh+(H-dh)/2,hz);lin.rotation.y=Math.PI;

 box(1.8,.08,1,wood,tx0,.8,tz0);for(const [a,b] of [[-.8,-.4],[.8,-.4],[-.8,.4],[.8,.4]])box(.08,.8,.08,wood,tx0+a,.4,tz0+b);cols.push({x:tx0,z:tz0,r:.95});

 const pap=add(new THREE.Mesh(new THREE.BoxGeometry(.3,.012,.38),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(pc)})),tx0,.846,tz0);pap.rotation.y=r()*3;pap.userData={t:'paper'};inter.push(pap);

 for(let i=0,tries=0;i<crates&&tries<200;tries++){const x=(r()-.5)*(hx*2-1.6),z=(r()-.5)*(hz*2-2.4);

  const s=.6+r()*.3;const c=box(s,s,s,cm2,x,s/2,z);c.rotation.y=r()*3;cols.push({x,z,r:s*.75});i++}
 /* paintings */
 for(let i=0;i<2;i++){const c=document.createElement('canvas');c.width=c.height=64;const q=c.getContext('2d');q.fillStyle='hsl('+Math.floor(r()*360)+',25%,22%)';q.fillRect(0,0,64,64);q.fillStyle='#000';q.beginPath();q.arc(32,34,14,0,6.28);q.fill();
  const p=add(new THREE.Mesh(new THREE.PlaneGeometry(.9,1.1),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(c)})),(i?-1:1)*hx*.4,1.8,-hz+.02);}
 /* code & note */
 const d3=()=>String(100+Math.floor(r()*900));let code,ba=0,bb=0,pre='';
 if(type==='A'){code=String(1000+Math.floor(r()*9000))}
 else if(type==='B'){ba=1000+Math.floor(r()*4000);bb=1000+Math.floor(r()*4000);code=String(ba+bb)}
 else{pre=d3();code=pre+cn}
 safeCode=code;const ns={};
 for(const l of['RU','EN']){const T2=D[l],q=type==='A'?T2.A.replace('{c}',code):type==='B'?T2.B.replace('{a}',ba).replace('{b}',bb):T2.C.replace('{p}',pre);
  ns[l]=T2.paper+' #'+L+' — '+T2.locs[li]+'\n\n'+T2.story[li]+'\n\n'+q}
 room.userData.note=ns;
 hasKey=false;hasPaper=false;camera.position.set(0,1.6,-hz+1.2);yaw=Math.PI;pitch=0;applyRot();applyGfx();hud();
}
/* ===== controls ===== */
const keys=new Set();let yaw=Math.PI,pitch=0,locked=false;
const applyRot=()=>{camera.rotation.set(pitch,yaw,0)};
const MAP={wasd:{f:'KeyW',b:'KeyS',l:'KeyA',r:'KeyD'},arrows:{f:'ArrowUp',b:'ArrowDown',l:'ArrowLeft',r:'ArrowRight'}};
let listening=false;
addEventListener('keydown',e=>{
 if(listening){e.preventDefault();if(e.code!=='Escape'){ST.interact=e.code;store()}listening=false;$('sk').textContent=kname(ST.interact);return}
 if($('safeM').style.display==='flex'){if(/^Digit\d$/.test(e.code))num(e.code.slice(5));else if(e.code==='Backspace')num('C');else if(e.code==='Enter')num('OK');return}
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 keys.add(e.code);if(e.code===ST.interact&&!e.repeat&&locked)interact()});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0025;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.0025));applyRot()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cc;if(!locked)keys.clear();$('click').style.display=(!locked&&started&&!modalOpen())?'flex':'none'});
$('click').onclick=lock;
/* ===== interaction ===== */
const ray=new THREE.Raycaster();let hov=null;
function look(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const h=ray.intersectObjects(inter,false);const p=$('prompt');
 if(!busy&&h.length&&h[0].distance<2.6){hov=h[0].object;p.textContent=tx('press').replace('{K}',kname(ST.interact));p.style.display='block'}else{hov=null;p.style.display='none'}}
function interact(){if(!hov||busy)return;const t=hov.userData.t;beep(520,.12);
 if(t==='paper'){hasPaper=true;const n=room.userData.note;if(!SV.journal.some(j=>j.l===SV.level)){SV.journal.push({l:SV.level,RU:n.RU,EN:n.EN});store()}$('pb').textContent=n[ST.lang];hud();openM('paperM')}
 else if(t==='safe'){if(hasKey){toast(tx('safeEmpty'));return}$('si').value='';openM('safeM')}
 else if(t==='door'){if(!hasKey){toast(tx('locked'));beep(160,.25);return}
  busy=true;opening=.001;toast(tx('opened'),1200)}}
function num(v){const i=$('si');if(v==='C')i.value='';else if(v==='OK'){if(i.value===safeCode){hasKey=true;beep(880,.3);closeM('safeM');toast(tx('right'));hud()}else{i.value='';beep(140,.3);toast(tx('wrong'),1500)}}else if(i.value.length<4)i.value+=v}
function nextLevel(){if(SV.level>=100){toast(tx('finish'),5000);busy=false;opening=0;doorPivot.rotation.y=0;return}
 SV.level++;SV.coins+=50;store();buildRoom();$('fade').style.opacity=0;setTimeout(()=>busy=false,500)}
/* ===== buttons ===== */
$('lang').onclick=()=>{ST.lang=ST.lang==='RU'?'EN':'RU';store();applyLang()};
$('gear').onclick=()=>{$('sg').value=ST.gfx;$('sm').value=ST.move;$('sv').value=ST.vol;openM('setM')};
$('sbtn').onclick=()=>{$('sg').value=ST.gfx;$('sm').value=ST.move;$('sv').value=ST.vol;$('setM').style.display='flex'};
$('setc').onclick=()=>{ST.gfx=$('sg').value;ST.move=$('sm').value;ST.vol=+$('sv').value;if(gn)gn.gain.value=ST.vol*.12;store();applyGfx();$('setM').style.display='none';if(started&&!modalOpen())lock()};
$('sv').oninput=()=>{if(gn)gn.gain.value=+$('sv').value*.12};
$('sk').onclick=()=>{listening=true;$('sk').textContent=tx('listen')};
$('pc').onclick=()=>closeM('paperM');$('sc').onclick=()=>closeM('safeM');
$('jbtn').onclick=()=>{$('jb').textContent=SV.journal.length?SV.journal.map(j=>j[ST.lang]).join('\n\n----------------\n\n'):tx('jEmpty');$('jM').style.display='flex'};
$('jc').onclick=()=>{$('jM').style.display='none'};
function begin(){$('menu').style.display='none';started=true;audioInit();buildRoom();lock()}
$('play').onclick=begin;
$('newg').onclick=()=>{if(confirm(tx('confirm'))){SV={level:1,coins:0,journal:[]};store();begin()}};
/* ===== loop ===== */
const clock=new THREE.Clock();let fl=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());
 if(started){
  if(locked&&!busy){const m=MAP[ST.move];let f=(keys.has(m.f)?1:0)-(keys.has(m.b)?1:0),s=(keys.has(m.r)?1:0)-(keys.has(m.l)?1:0);
   if(f||s){const l=Math.hypot(f,s),sp=(keys.has('ShiftLeft')?4.2:2.8)*dt,sy=Math.sin(yaw),cy=Math.cos(yaw);camera.position.x+=(-sy*f/l+cy*s/l)*sp;camera.position.z+=(-cy*f/l-sy*s/l)*sp}
   for(const c of cols){const ax=camera.position.x-c.x,az=camera.position.z-c.z,d=Math.hypot(ax,az),mn=c.r+.3;if(d<mn&&d>0){camera.position.x=c.x+ax/d*mn;camera.position.z=c.z+az/d*mn}}
   camera.position.x=Math.max(-hx+.35,Math.min(hx-.35,camera.position.x));camera.position.z=Math.max(-hz+.35,Math.min(hz-.35,camera.position.z))}
  if(opening>0){opening+=dt/.9;doorPivot.rotation.y=-Math.PI/2.1*Math.min(1,opening);if(opening>1.1){opening=0;$('fade').style.opacity=1;setTimeout(nextLevel,550)}}
  fl-=dt;if(fl<=0){fl=2+Math.random()*5;if(pLight&&Math.random()<.4){pLight.intensity=.15;setTimeout(()=>{if(pLight)pLight.intensity=.9},90+Math.random()*120)}}
  flash.position.copy(camera.position);const fw=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);flash.target.position.copy(camera.position).add(fw);
  look()}
 renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
applyLang();applyGfx();loop();
</script>
