<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Последний шанс — исправленный прототип</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#eef3f6;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#07111ddd;border:1px solid #9c793d;border-radius:10px;box-shadow:0 5px 24px #0008}.brand,.stats,#objective{position:absolute;padding:10px 13px}.brand{top:12px;left:12px}.brand strong{display:block;color:#e9b85b;letter-spacing:2px}.brand small{color:#adbdc7}.stats{right:12px;top:12px;text-align:right;font-size:13px;line-height:1.7}.stats b{color:#f0c36b}#objective{top:100px;left:12px;max-width:260px;font-size:13px}#hint{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);padding:10px 14px;display:none;text-align:center;max-width:90%;font-size:13px}.controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96%;pointer-events:auto}button{background:#172936;color:#fff;border:1px solid #647783;border-radius:8px;padding:10px 12px;font-weight:bold;cursor:pointer;touch-action:manipulation}button.primary{background:#9c6b22;border-color:#e9b85b}#touch{display:none;position:absolute;bottom:80px;left:12px;pointer-events:auto;gap:5px;flex-direction:column}#touch div{display:flex;gap:5px}#touch button{width:48px;height:44px;padding:0;font-size:18px}#modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:16px;z-index:5}#modal .panel{padding:20px;width:min(360px,100%);text-align:center}#code{width:100%;font-size:24px;text-align:center;letter-spacing:8px;padding:10px;margin:8px 0;background:#0b141b;color:white;border:1px solid #71818b;border-radius:8px}#toast{display:none;position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:6;background:#07111df2;border:1px solid #b58c45;padding:12px 16px;border-radius:10px;max-width:90%;text-align:center}@media(max-width:650px){.brand{top:7px;left:7px;padding:8px}.brand strong{font-size:12px}.brand small{font-size:10px}.stats{top:7px;right:7px;font-size:11px;padding:7px}#objective{top:76px;left:7px;font-size:11px;max-width:190px}.controls{bottom:7px;gap:4px}.controls button{padding:9px;font-size:11px}#touch{display:flex}#hint{bottom:130px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="brand panel"><strong>ПОСЛЕДНИЙ ШАНС</strong><small>3D-приключение • исправленная версия</small></div><div class="stats panel">Сектор: <b id="room">01</b><br>Очки: <b id="score">0</b> · Монеты: <b id="coins">0</b><br>Камера: <b id="cam">1-е лицо</b></div><div id="objective" class="panel">ЗАДАНИЕ<br><b id="task">Найдите ключ и записку в лаборатории.</b><br><span id="clue">Код замка: найдите подсказку.</span></div><div id="hint" class="panel"></div><div class="controls"><button id="camBtn">Камера: 1-е лицо [V]</button><button id="act" class="primary">Осмотреть рядом [E]</button><button id="help">Управление</button><button id="reset">С начала</button></div><div id="touch"><button data-m="f">▲</button><div><button data-m="l">◀</button><button data-m="b">▼</button><button data-m="r">▶</button></div></div></div><div id="modal"><div class="panel"><h2>Электронный замок</h2><p>Введите код из записки.</p><input id="code" maxlength="4" inputmode="numeric" placeholder="••••"><div style="display:flex;gap:8px"><button id="cancel" style="flex:1">Назад</button><button id="open" class="primary" style="flex:1">Открыть</button></div></div></div><div id="toast"></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');const $=id=>document.getElementById(id);let W=innerWidth,H=innerHeight;function resize(){W=innerWidth;H=innerHeight;c.width=Math.floor(W*devicePixelRatio);c.height=Math.floor(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
// Self-contained pseudo-3D raycaster: no external libraries, modules, or downloads required.
let px=0,pz=5.2,angle=0,pitch=0,first=true,room=1,score=0,coins=0,key=false,note=false,clock=false,door=false,modal=false;const keys={f:false,b:false,l:false,r:false};const items=[{id:'key',x:-2.8,z:1.7,name:'Старый ключ',desc:'Ключ от аварийного замка.',taken:false},{id:'note',x:2.8,z:-1.1,name:'Записка',desc:'На бумаге написано: «Код замка — 1842».',taken:false},{id:'clock',x:4.2,z:-5.2,name:'Сломанные часы',desc:'Стрелки застыли на 18:42.',taken:false}];let toastTimer;function say(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
const mapW=12,mapD=16;function wall(x,z){return x<-.5||x>11.5||z<-.5||z>15.5} // map coordinate system uses x,z positive forward into room
function project(wx,wy,wz){let dx=wx-px,dz=wz-pz,ca=Math.cos(angle),sa=Math.sin(angle);let xx=dx*ca-dz*sa,zz=dx*sa+dz*ca;if(zz<.08)return null;let focal=Math.min(W,H)*.8;return {x:W/2+xx*focal/zz,y:H*.52-(wy-1.55-pitch)*focal/zz,z:zz,s:focal/zz}}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#111e2a');sky.addColorStop(.55,'#26343b');sky.addColorStop(1,'#090e12');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let horizon=H*.52;ctx.fillStyle='#303a3d';ctx.fillRect(0,horizon,W,H-horizon);
// floor perspective grid
ctx.strokeStyle='#61707544';ctx.lineWidth=1;for(let i=1;i<18;i++){let y=horizon+Math.pow(i/18,2)*(H-horizon);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=-8;x<=8;x++){ctx.beginPath();ctx.moveTo(W/2+x*14,horizon);ctx.lineTo(W/2+x*W/5,H);ctx.stroke()}
// corridor walls as projected vertical planes
function wallPlane(x,z,w,h,color){let a=project(x,0,z),b=project(x+w,0,z),d=project(x,h,z),e=project(x+w,h,z);if(!a||!b||!d||!e)return;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(e.x,e.y);ctx.lineTo(b.x,b.y);ctx.lineTo(a.x,a.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#9ca8a944';ctx.stroke()}
wallPlane(-5.5,0,0,4,'#3b454b'); // side wall
// draw side walls with perspective polygons
function poly(points,color){let p=points.map(q=>project(q[0],q[1],q[2]));if(p.some(v=>!v))return;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);p.slice(1).forEach(v=>ctx.lineTo(v.x,v.y));ctx.closePath();ctx.fill();ctx.strokeStyle='#9ca8a933';ctx.stroke()}
poly([[-5.5,0,0],[-5.5,0,15],[-5.5,4,15],[-5.5,4,0]],'#38434a');poly([[5.5,0,0],[5.5,0,15],[5.5,4,15],[5.5,4,0]],'#303b41');poly([[-5.5,4,0],[5.5,4,0],[5.5,4,15],[-5.5,4,15]],'#252f35');
// ceiling light panels
for(let z=1;z<15;z+=3){let p=project(0,3.8,z);if(p){ctx.fillStyle='#e1d2a6';ctx.fillRect(p.x-p.s*.7,p.y-p.s*.12,p.s*1.4,p.s*.24);ctx.fillStyle='#d9d0a4';ctx.fillRect(p.x-p.s*.62,p.y-p.s*.05,p.s*1.24,p.s*.1)}}
// workbenches / lockers / lab equipment
function cube(x,y,z,w,h,d,color,label){let p=project(x,y+h,z);let p2=project(x+w,y+h,z),p3=project(x+w,y,z),p4=project(x,y,z);if(!p||!p2||!p3||!p4)return;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#c1cbd033';ctx.stroke();if(label){ctx.fillStyle='#e9b85b';ctx.fillRect(p.x,p.y,Math.max(2,p2.x-p.x),Math.max(2,p4.y-p.y)*.08)}}
cube(-4.6,0,2,.8,2.1,.7,'#52616a',true);cube(-3.5,0,2,.8,2.1,.7,'#46555e',true);cube(-2.8,0,6,2.2,.85,.9,'#5c5144',true);cube(2.5,0,7,2,.8,1,'#49565d',true);cube(3.8,0,3,.9,.7,.9,'#51463d',true);
// door in far wall
let dp=project(0,0,14.7),dt=project(0,3,14.7),dr=project(1.4,0,14.7),dtr=project(1.4,3,14.7);if(dp&&dt&&dr&&dtr){ctx.fillStyle='#10191f';ctx.fillRect(dt.x,dt.y,dtr.x-dt.x,dp.y-dt.y);ctx.fillStyle=door?'#4c9c83':'#4c5c65';ctx.fillRect(dt.x+3,dt.y+3,dtr.x-dt.x-6,dp.y-dt.y-6);ctx.strokeStyle='#c1a15d';ctx.strokeRect(dt.x+3,dt.y+3,dtr.x-dt.x-6,dp.y-dt.y-6);ctx.fillStyle=door?'#64ffd1':'#e9b85b';ctx.fillRect(dt.x+(dtr.x-dt.x)*.7,(dt.y+dp.y)/2,Math.max(3,(dtr.x-dt.x)*.07),Math.max(3,(dp.y-dt.y)*.1))}
// objects in world
for(const it of items){if(it.taken)continue;let p=project(it.x,.7,it.z);if(!p)continue;let r=Math.max(3,Math.min(22,p.s*.13));ctx.save();ctx.translate(p.x,p.y);if(it.id==='key'){ctx.strokeStyle='#f1c45d';ctx.lineWidth=Math.max(2,r*.22);ctx.beginPath();ctx.arc(0,0,r*.48,0,Math.PI*2);ctx.moveTo(r*.45,0);ctx.lineTo(r*1.1,0);ctx.lineTo(r*1.1,r*.4);ctx.stroke()}else if(it.id==='note'){ctx.fillStyle='#ded0a9';ctx.fillRect(-r*.6,-r*.45,r*1.2,r*.9);ctx.strokeStyle='#75694d';ctx.strokeRect(-r*.6,-r*.45,r*1.2,r*.9);ctx.strokeStyle='#776b55';ctx.beginPath();ctx.moveTo(-r*.35,-r*.12);ctx.lineTo(r*.35,-r*.12);ctx.moveTo(-r*.35,r*.1);ctx.lineTo(r*.3,r*.1);ctx.stroke()}else{ctx.fillStyle='#29353b';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f0d59a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*.7,0,Math.PI*2);ctx.moveTo(0,0);ctx.lineTo(0,-r*.48);ctx.stroke()}ctx.restore()}
// simple third-person hero
if(!first){let p=project(px,0,pz);if(p){let s=Math.max(10,Math.min(70,p.s*.42));ctx.fillStyle='#1a242b';ctx.fillRect(p.x-s*.3,p.y-s*.15,s*.6,s*.9);ctx.fillStyle='#a58c70';ctx.beginPath();ctx.arc(p.x,p.y-s*.35,s*.22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#405766';ctx.fillRect(p.x-s*.38,p.y-s*.1,s*.76,s*.42)}}
// crosshair and vignette
ctx.strokeStyle='#ffffffaa';ctx.beginPath();ctx.arc(W/2,H*.52,4,0,Math.PI*2);ctx.stroke();let near=nearest();$('hint').style.display=near?'block':'none';if(near)$('hint').textContent='E — '+near.name+' · '+near.desc;requestAnimationFrame(draw)}
function nearest(){let best=null,bd=2.2;for(const it of items){if(it.taken)continue;let d=Math.hypot(it.x-px,it.z-pz);if(d<bd){bd=d;best=it}}if(Math.hypot(px,pz-14.7)<2.1)return {id:'door',name:'Герметичная дверь',desc:'Электронный замок. Нужен ключ и код.'};return best}
function update(){ $('room').textContent=String(room).padStart(2,'0');$('score').textContent=score;$('coins').textContent=coins;$('cam').textContent=first?'1-е лицо':'3-е лицо';$('camBtn').textContent='Камера: '+(first?'1-е лицо':'3-е лицо')+' [V]';$('task').textContent=door?'Дверь открыта — пройдите вперёд в следующий сектор.':(key&&note?'Откройте дверь кодом 1842.':'Найдите ключ и записку в лаборатории.');$('clue').textContent=note?'Подсказка: код 1842.':clock?'Часы показывают 18:42.':'Исследуйте предметы рядом со столами.'}
function interact(){let it=nearest();if(!it){say('Подойдите ближе к предмету и нажмите E.');return}if(it.id==='key'){it.taken=true;key=true;score+=50;coins+=10;say('Ключ найден! +50 очков, +10 монет.')}else if(it.id==='note'){it.taken=true;note=true;score+=25;coins+=5;say('Записка прочитана. Код замка: 1842.')}else if(it.id==='clock'){it.taken=true;clock=true;score+=10;say('Часы остановились на 18:42.')}else if(it.id==='door'){if(!key){say('Сначала найдите старый ключ.');}else{$('modal').style.display='flex';$('code').value='';modal=true}}update()}
function submit(){if($('code').value==='1842'){ $('modal').style.display='none';modal=false;door=true;score+=100;coins+=20;say('Замок открыт! Идите к двери.');update()}else say('Неверный код. Изучите записку.')}function reset(){px=0;pz=5.2;angle=0;room=1;score=coins=0;key=note=clock=door=false;items.forEach(i=>i.taken=false);$('modal').style.display='none';update();say('Сектор перезапущен.')}
const km={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};addEventListener('keydown',e=>{if(km[e.code]){keys[km[e.code]]=true;e.preventDefault()}if(e.code==='KeyE'||e.code==='Space')interact();if(e.code==='KeyV'){first=!first;update()}if(e.code==='Enter'&&modal)submit();if(e.code==='Escape'){$('modal').style.display='none';modal=false}});addEventListener('keyup',e=>{if(km[e.code])keys[km[e.code]]=false});let last=performance.now();function move(now){let dt=Math.min(.04,(now-last)/1000);last=now;let f=(keys.f?1:0)-(keys.b?1:0),s=(keys.r?1:0)-(keys.l?1:0);px+=(-Math.sin(angle)*f+Math.cos(angle)*s)*dt*2.7;pz+=(Math.cos(angle)*f+Math.sin(angle)*s)*dt*2.7;px=Math.max(-5,Math.min(5,px));pz=Math.max(.3,Math.min(15.1,pz));if(pz>14.2&&Math.abs(px)<1.5){if(door){room++;door=false;key=note=clock=false;items.forEach(i=>i.taken=false);px=0;pz=2;score+=50;coins+=10;say('Новый сектор '+room+'!');}else pz=14.1}requestAnimationFrame(move)}document.querySelectorAll('[data-m]').forEach(b=>{let k=b.dataset.m;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});let dragging=false,lastX=0;c.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(dragging&&first){angle+=(e.clientX-lastX)*.005;lastX=e.clientX}});$('camBtn').onclick=()=>{first=!first;update()};$('act').onclick=interact;$('help').onclick=()=>say('WASD/стрелки — движение · E — предметы и двери · V — смена камеры. На телефоне используйте стрелки. Поворачивайте обзор, проводя пальцем/мышью по сцене.');$('reset').onclick=reset;$('cancel').onclick=()=>{$('modal').style.display='none';modal=false};$('open').onclick=submit;$('code').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});update();draw();move(performance.now());
})();</script></body></html>
